name: Deploy to AWS Elastic Beanstalk

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build Application with Maven
      run: mvn clean package -DskipTests

    - name: Generate Deployment Package
      run: |
        mkdir -p deploy
        cp target/ak-construction-*.jar deploy/application.jar
        cp Procfile deploy/Procfile 2>/dev/null || true
        cp -r .ebextensions deploy/ 2>/dev/null || true
        cd deploy && zip -r ../deploy-package-${{ github.sha }}.zip .

    - name: Deploy to AWS Elastic Beanstalk
      uses: einaregilsson/beanstalk-deploy@v22
      with:
        aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        application_name: ${{ secrets.AWS_EB_APP_NAME || 'ak-construction' }}
        environment_name: ${{ secrets.AWS_EB_ENV_NAME || 'ak-construction-env' }}
        version_label: "ak-construction-${{ github.sha }}"
        region: ${{ secrets.AWS_REGION || 'us-east-1' }}
        deployment_package: deploy-package-${{ github.sha }}.zip
